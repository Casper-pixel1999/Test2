<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1a0f0a" />
  <title>Бургерная</title>
</head>
<body>
  <div id="app">
    <div id="loading">
      <div class="logo">🍔 Бургерная</div>
      <div class="bar"><div id="loadBar"></div></div>
      <p id="loadText">Загрузка…</p>
    </div>

    <canvas id="game"></canvas>
    <div id="bubbles"></div>

    <div id="hud" class="hidden">
      <div class="hud-top">
        <div class="cash-wrap">
          <div class="cash" id="cashDisplay">💰 0</div>
          <div class="carry" id="carryDisplay">🍖 0 · 🍔 0</div>
          <div id="restLevelHud" class="rest-level">
            <div class="rl-top"><span id="restLvLabel">Lv 1</span><span id="restXpLabel">XP 0/40</span></div>
            <div class="rl-bar"><i id="restXpBar"></i></div>
          </div>
          <div id="missionHud" class="mission-hud">
            <div class="mh-title" id="missionTitle">Mission</div>
            <div class="mh-body" id="missionBody">—</div>
            <div class="mh-bar"><i id="missionBar"></i></div>
          </div>
          <div id="menuStrip" class="menu-strip"></div>
        </div>
        <div class="hud-actions">
          <button type="button" id="btnShop" class="btn" aria-label="Shop">🛒</button>
          <button type="button" id="btnReward" class="btn reward" title="x2">🎬 x2</button>
          <button type="button" id="btnMute" class="btn" aria-label="Mute">🔊</button>
          <button type="button" id="btnLang" class="btn">RU</button>
        </div>
      </div>
      <div id="orderQueue" class="order-queue hidden"></div>
      <div id="hintBanner" class="hint-banner">
        <div id="hintStep" class="hint-step"></div>
        <div id="hintText" class="hint"></div>
      </div>
      <div id="tutorialArrow" class="hidden">▼</div>
      <div id="floatLayer"></div>
      <div id="toastHost"></div>
    </div>

    <div id="joystick" class="hidden">
      <div id="joyBase"><div id="joyKnob"></div></div>
    </div>

    <div id="shop" class="modal hidden">
      <div class="panel">
        <h2 id="shopTitle">Улучшения</h2>
        <div id="shopList"></div>
        <button type="button" id="btnCloseShop" class="btn wide">Закрыть</button>
      </div>
    </div>

    <div id="pauseOverlay" class="modal hidden">
      <div class="panel">
        <h2 id="pauseTitle">Пауза</h2>
        <p id="pauseHint">Игра на паузе</p>
      </div>
    </div>

    <div id="offlineModal" class="modal hidden">
      <div class="panel">
        <h2 id="offlineTitle">Пока тебя не было</h2>
        <p id="offlineBody"></p>
        <button type="button" id="offlineClaim" class="btn wide">Забрать</button>
        <button type="button" id="offlineX2" class="btn wide reward" style="margin-top:8px">x2 за рекламу</button>
      </div>
    </div>

    <div id="hrModal" class="modal hidden">
      <div class="panel">
        <h2 id="hrTitle">HR</h2>
        <div id="hrList"></div>
        <button type="button" id="btnCloseHr" class="btn wide">Закрыть</button>
      </div>
    </div>

    <div id="playerUpModal" class="modal hidden">
      <div class="panel">
        <h2 id="playerUpTitle">Прокачка</h2>
        <div id="playerUpList"></div>
        <button type="button" id="btnClosePlayerUp" class="btn wide">Закрыть</button>
      </div>
    </div>
  </div>

  <script src="/sdk.js" onerror="window.__sdkMissing=true"></script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
